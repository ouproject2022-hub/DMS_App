{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="card border-0 shadow-lg login-card">
    <div class="card-body p-4 p-lg-5">
      <div class="text-center mb-4">
        <div class="app-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
        <h3 class="fw-bold mb-1">Document Management System</h3>
        <p class="text-muted mb-0">Ummid NGO · Mahalaxmi Trader · Personal</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control form-control-lg" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <button class="btn btn-primary btn-lg w-100">Login</button>
      </form>
      <div class="small text-muted mt-4 bg-light rounded p-3">
        Default admin comes from <code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code> in environment variables.
      </div>
    </div>
  </div>
</div>
{% endblock %}
