{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h4 class="fw-bold mb-0">Upload Document - {{ SECTIONS[section].label }}</h4>
      </div>
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Category <span class="text-danger">*</span></label>
              <select name="category" class="form-select" required>
                <option value="">Select Category</option>
                {% for cat in SECTIONS[section].categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Year <span class="text-danger">*</span></label>
              <input type="number" name="year" value="{{ current_year }}" class="form-control" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">Document Title <span class="text-danger">*</span></label>
              <input type="text" name="title" class="form-control" placeholder="Example: GST Certificate / School Registration / PAN Card" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">Related Name</label>
              <input type="text" name="related_name" class="form-control" placeholder="Person, school, company, donor, customer, etc.">
            </div>
            <div class="col-md-12">
              <label class="form-label">Choose File <span class="text-danger">*</span></label>
              <input type="file" name="file" class="form-control" required>
              <div class="form-text">Allowed: PDF, JPG, PNG, DOC, DOCX, XLS, XLSX, CSV, TXT</div>
            </div>
            <div class="col-md-12">
              <label class="form-label">Remarks</label>
              <textarea name="remarks" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('documents', section=section) }}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary"><i class="bi bi-cloud-upload"></i> Upload to Google Drive</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
